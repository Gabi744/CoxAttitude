/* ==========================================================================
   JEU 1 — COMBI SNAKE
   ========================================================================== */
var sGrid = { cols:0, rows:0, cell:0, ox:0, oy:0 };
var snake, sFood, sScore, sTick, sAcc, sFirstInput, sBestCache, sPrevBody, sInputQueue;

function setupSnakeGrid(){
  var targetCols = 9;
  var cell = Math.max(18, Math.floor(W / targetCols));
  var cols = Math.max(5, Math.floor(W / cell));
  var rows = Math.max(7, Math.floor(H / cell));
  sGrid.cell = cell; sGrid.cols = cols; sGrid.rows = rows;
  sGrid.ox = Math.floor((W - cols*cell) / 2);
  sGrid.oy = Math.floor((H - rows*cell) / 2);
}

function resetSnake(){
  setupSnakeGrid();
  var cx = Math.floor(sGrid.cols/2), cy = Math.floor(sGrid.rows/2);
  snake = {
    body:[ {x:cx,y:cy}, {x:cx-1,y:cy}, {x:cx-2,y:cy} ],
    dir:{x:1,y:0}
  };
  sPrevBody = snake.body.map(function(s){ return {x:s.x,y:s.y}; });
  sInputQueue = [];
  particles.length = 0; scorePopups.length = 0;
  sScore = 0; sTick = 170; sAcc = 0; sFirstInput = false;
  sBestCache = getBest('snake');
  placeSnakeFood();
  updateHUD(sScore, sBestCache);
}

function placeSnakeFood(){
  var pos;
  do {
    pos = { x:randInt(0,sGrid.cols-1), y:randInt(0,sGrid.rows-1) };
  } while (snake.body.some(function(s){ return s.x===pos.x && s.y===pos.y; }));
  sFood = { x:pos.x, y:pos.y, type: Math.random() < 0.5 ? 'can' : 'board' };
}

function isOpposite(a,b){ return a.x === -b.x && a.y === -b.y; }

// Met en file la prochaine direction (jusqu'à 2 en attente) — lue au prochain tick.
// Comparer au dernier élément déjà en file (pas juste à snake.dir) évite qu'un demi-tour
// se glisse entre deux inputs rapides, même à vitesse élevée.
function queueSnakeDir(nx, ny){
  var ref = sInputQueue.length ? sInputQueue[sInputQueue.length-1] : snake.dir;
  if (ref.x === nx && ref.y === ny) return;
  if (isOpposite({x:nx,y:ny}, ref)) return;
  if (sInputQueue.length >= 2) sInputQueue.shift();
  sInputQueue.push({x:nx,y:ny});
  if (!sFirstInput){ sFirstInput = true; hideHint(); }
}

function updateSnake(dtMs){
  sAcc += dtMs;
  if (sAcc < sTick) return;
  sAcc -= sTick; // conserve le reliquat de temps plutôt que de le perdre (timing plus régulier)

  if (sInputQueue.length){
    var nextDir = sInputQueue.shift();
    if (!isOpposite(nextDir, snake.dir)) snake.dir = nextDir;
  }

  sPrevBody = snake.body.map(function(s){ return {x:s.x,y:s.y}; });

  var head = snake.body[0];
  var nx = head.x + snake.dir.x, ny = head.y + snake.dir.y;
  if (nx < 0 || nx >= sGrid.cols || ny < 0 || ny >= sGrid.rows){
    var hx = sGrid.ox + clamp(nx,0,sGrid.cols-1)*sGrid.cell + sGrid.cell/2;
    var hy = sGrid.oy + clamp(ny,0,sGrid.rows-1)*sGrid.cell + sGrid.cell/2;
    endSnake(hx, hy); return;
  }
  if (snake.body.some(function(s){ return s.x===nx && s.y===ny; })){
    var hx2 = sGrid.ox + nx*sGrid.cell + sGrid.cell/2;
    var hy2 = sGrid.oy + ny*sGrid.cell + sGrid.cell/2;
    endSnake(hx2, hy2); return;
  }
  snake.body.unshift({x:nx,y:ny});
  if (nx === sFood.x && ny === sFood.y){
    var fx = sGrid.ox + sFood.x*sGrid.cell + sGrid.cell/2;
    var fy = sGrid.oy + sFood.y*sGrid.cell + sGrid.cell/2;
    sfxPickup();
    spawnParticles(fx, fy, [PAL.mustard, PAL.terracotta, PAL.paper], 10, { upBias:40, minLife:0.3, maxLife:0.5 });
    spawnScorePopup(fx, fy, '+10', PAL.tealDark);
    sScore += 10;
    sTick = Math.max(95, 170 - Math.floor(sScore/40)*6);
    placeSnakeFood();
    updateHUD(sScore, sBestCache);
  } else {
    snake.body.pop();
  }
}

function renderSnake(){
  ctx.fillStyle = PAL.cream;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = PAL.paper;
  roundRectPath(ctx, sGrid.ox-4, sGrid.oy-4, sGrid.cols*sGrid.cell+8, sGrid.rows*sGrid.cell+8, 14);
  ctx.fill();

  // grille — lignes fines qui délimitent vraiment chaque case (remplace les points, plus lisible)
  ctx.strokeStyle = 'rgba(51,48,46,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var gx=0; gx<=sGrid.cols; gx++){
    var lx = sGrid.ox + gx*sGrid.cell;
    ctx.moveTo(lx, sGrid.oy);
    ctx.lineTo(lx, sGrid.oy + sGrid.rows*sGrid.cell);
  }
  for (var gy=0; gy<=sGrid.rows; gy++){
    var ly = sGrid.oy + gy*sGrid.cell;
    ctx.moveTo(sGrid.ox, ly);
    ctx.lineTo(sGrid.ox + sGrid.cols*sGrid.cell, ly);
  }
  ctx.stroke();

  var fcx = sGrid.ox + sFood.x*sGrid.cell + sGrid.cell/2;
  var fcy = sGrid.oy + sFood.y*sGrid.cell + sGrid.cell/2;
  drawFood(ctx, fcx, fcy, sGrid.cell*0.86, sFood.type);

  // interpolation entre la position précédente et la position actuelle de chaque
  // segment pour un glissé fluide entre deux ticks, plutôt qu'un saut instantané.
  var t = clamp(sAcc / sTick, 0, 1);
  function renderPos(i){
    var curr = snake.body[i];
    var prev = sPrevBody[i] || curr; // segment tout juste créé (croissance) : pas d'interpolation
    return { x: lerp(prev.x, curr.x, t), y: lerp(prev.y, curr.y, t) };
  }

  for (var i=snake.body.length-1;i>=1;i--){
    var seg = snake.body[i], prevSeg = snake.body[i-1];
    var angle = Math.atan2(prevSeg.y-seg.y, prevSeg.x-seg.x);
    var rp = renderPos(i);
    drawTrailer(ctx, sGrid.ox+rp.x*sGrid.cell+sGrid.cell/2, sGrid.oy+rp.y*sGrid.cell+sGrid.cell/2, sGrid.cell*0.94, angle, i);
  }

  var headAngle = Math.atan2(snake.dir.y, snake.dir.x);
  var rh = renderPos(0);
  drawCombi(ctx, sGrid.ox+rh.x*sGrid.cell+sGrid.cell/2, sGrid.oy+rh.y*sGrid.cell+sGrid.cell/2, sGrid.cell*1.05, headAngle);
}

function endSnake(hx, hy){
  running = false;
  flashCrash(hx, hy);
  var token = sessionToken;
  setTimeout(function(){
    if (token !== sessionToken) return;
    finishRun('snake', sScore, 'COMBI ACCIDENTÉ !');
  }, 380);
}

/* ==========================================================================
   JEU 2 — BEETLE HIGHWAY
   ========================================================================== */
var hLanes = { count:3, width:0, roadW:0, roadX:0 };
var beetle, hObstacles, hDecor, hScore, hDistance, hSpeed, hSpawnAcc, hFirstInput, hBestCache, hLastOpenLanes;
var H_BASE_SPEED = 230, H_ACCEL = 0.03, H_SPAWN_GAP = 260, BEETLE_Y_RATIO = 0.80;
var BEETLE_W_RATIO = 0.52; // taille visuelle de la Coccinelle du joueur, relative à la largeur d'une voie
var H_MIN_REACT_TIME = 0.65; // secondes minimum garanties entre deux vagues, quelle que soit la vitesse

function setupHighwayLanes(){
  var roadW = Math.min(W*0.94, 430);
  hLanes.roadW = roadW;
  hLanes.roadX = (W - roadW) / 2;
  hLanes.width = roadW / hLanes.count;
}

function laneCenterX(lane){
  return hLanes.roadX + hLanes.width*lane + hLanes.width/2;
}

function resetHighway(){
  setupHighwayLanes();
  beetle = { x: laneCenterX(1), targetLane:1, tilt:0 };
  hObstacles = [];
  hDecor = [];
  particles.length = 0; scorePopups.length = 0;
  hScore = 0; hDistance = 0; hSpeed = H_BASE_SPEED; hSpawnAcc = 0; hFirstInput = false;
  hLastOpenLanes = null;
  hBestCache = getBest('highway');
  updateHUD(hScore, hBestCache);
}

function setBeetleLane(lane){
  var newLane = clamp(lane, 0, hLanes.count-1);
  if (newLane !== beetle.targetLane){
    sfxLaneChange();
    spawnParticles(beetle.x, H*BEETLE_Y_RATIO+16, [PAL.roadLine, PAL.sand], 4, { minSpeed:15, maxSpeed:50, minLife:0.18, maxLife:0.3, minSize:1.5, maxSize:3 });
  }
  beetle.targetLane = newLane;
  if (!hFirstInput){ hFirstInput = true; hideHint(); }
}

function shuffleArray(arr){
  for (var i=arr.length-1;i>0;i--){
    var j = randInt(0,i);
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// Système de vérification anti-blocage : on garantit qu'au moins une voie restée
// libre à la vague précédente le reste aussi à celle-ci. Un joueur qui ne bouge
// pas de cette voie n'est donc jamais pris au piège entre deux vagues, quelle
// que soit la vitesse. La distance/temps minimum entre deux vagues (voir
// H_MIN_REACT_TIME dans updateHighway) vient compléter cette garantie.
function spawnObstacleWave(){
  var lanesToBlock = Math.random() < 0.35 ? 2 : 1;
  var allLanes = [];
  for (var i=0;i<hLanes.count;i++) allLanes.push(i);

  var safeLane = (hLastOpenLanes && hLastOpenLanes.length) ? choice(hLastOpenLanes) : null;
  var blockable = safeLane === null ? allLanes.slice() : allLanes.filter(function(l){ return l !== safeLane; });
  shuffleArray(blockable);
  var chosen = blockable.slice(0, Math.min(lanesToBlock, blockable.length));
  var openLanes = allLanes.filter(function(l){ return chosen.indexOf(l) === -1; });

  var types = ['cone','pothole','slowcar'];
  chosen.forEach(function(lane){
    hObstacles.push({ lane:lane, y:-80, type: choice(types) });
  });
  hLastOpenLanes = openLanes;
}

function spawnDecor(){
  var side = Math.random() < 0.5 ? -1 : 1;
  var x = side < 0 ? rand(6, hLanes.roadX-14) : rand(hLanes.roadX+hLanes.roadW+14, W-6);
  hDecor.push({ x:x, y:-40, type: Math.random() < 0.5 ? 'palm' : 'cactus' });
}

function updateHighway(dt){
  hSpeed = H_BASE_SPEED + hDistance*H_ACCEL; // plus de plafond : ça accélère jusqu'à ce que le joueur perde
  var dy = hSpeed * dt;
  hDistance += dy;
  hScore = Math.floor(hDistance/10);

  var tx = laneCenterX(beetle.targetLane);
  beetle.x = lerp(beetle.x, tx, Math.min(1, dt*10));
  beetle.tilt = clamp((tx-beetle.x)*0.012, -0.35, 0.35);

  for (var i=hObstacles.length-1;i>=0;i--){
    hObstacles[i].y += dy;
    if (hObstacles[i].y > H+80) hObstacles.splice(i,1);
  }
  for (var d=hDecor.length-1;d>=0;d--){
    hDecor[d].y += dy;
    if (hDecor[d].y > H+60) hDecor.splice(d,1);
  }

  hSpawnAcc += dy;
  var requiredGap = Math.max(H_SPAWN_GAP, hSpeed * H_MIN_REACT_TIME);
  if (hSpawnAcc >= requiredGap){
    hSpawnAcc = 0;
    spawnObstacleWave();
    if (Math.random() < 0.6) spawnDecor();
  }

  updateHUD(hScore, hBestCache);

  // La vitesse n'étant plus plafonnée, un obstacle peut franchir plusieurs dizaines de
  // pixels en un seul frame : on teste donc le segment parcouru ce frame (position avant
  // + après déplacement) plutôt que la seule position finale, pour ne jamais "traverser"
  // le joueur sans détecter le contact.
  var shrink = 0.7;
  var bw = hLanes.width*BEETLE_W_RATIO*0.9*shrink, bh = bw*1.3;
  var beetleY = H*BEETLE_Y_RATIO;
  var bx1 = beetle.x-bw/2, bx2 = beetle.x+bw/2, by1 = beetleY-bh/2, by2 = beetleY+bh/2;
  for (var o=0;o<hObstacles.length;o++){
    var obs = hObstacles[o];
    var ox = laneCenterX(obs.lane);
    var ow = hLanes.width*0.5*shrink;
    var oh = ow * (obs.type === 'slowcar' ? 1.3 : 0.8);
    var ox1 = ox-ow/2, ox2 = ox+ow/2;
    var oy1 = (obs.y - dy) - oh/2, oy2 = obs.y + oh/2; // balayage sur tout le trajet du frame
    if (rectsOverlap(bx1,by1,bx2,by2,ox1,oy1,ox2,oy2)){ endHighway(beetle.x, beetleY); return; }
  }
}

function renderHighway(){
  ctx.fillStyle = PAL.sand;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = PAL.road;
  ctx.fillRect(hLanes.roadX,0,hLanes.roadW,H);
  // ombrage des bords de la chaussée — donne du relief à l'asphalte plutôt qu'un aplat
  var roadShade = ctx.createLinearGradient(hLanes.roadX,0,hLanes.roadX+hLanes.roadW,0);
  roadShade.addColorStop(0,'rgba(0,0,0,0.22)');
  roadShade.addColorStop(0.07,'rgba(0,0,0,0)');
  roadShade.addColorStop(0.93,'rgba(0,0,0,0)');
  roadShade.addColorStop(1,'rgba(0,0,0,0.22)');
  ctx.fillStyle = roadShade;
  ctx.fillRect(hLanes.roadX,0,hLanes.roadW,H);
  ctx.fillStyle = PAL.roadLine;
  ctx.fillRect(hLanes.roadX-4,0,4,H);
  ctx.fillRect(hLanes.roadX+hLanes.roadW,0,4,H);

  var dashLen=28, gap=22, period=dashLen+gap;
  var offset = hDistance % period;
  for (var lane=1; lane<hLanes.count; lane++){
    var lx = hLanes.roadX + hLanes.width*lane - 2;
    for (var y=-period; y<H+period; y+=period){
      ctx.fillRect(lx, y+offset, 4, dashLen);
    }
  }

  hDecor.forEach(function(dd){ drawRoadsideDecor(ctx, dd.x, dd.y, dd.type); });
  hObstacles.forEach(function(oo){
    var ox = laneCenterX(oo.lane);
    drawObstacle(ctx, ox, oo.y, hLanes.width, oo.type);
  });

  drawBeetleTopDown(ctx, beetle.x, H*BEETLE_Y_RATIO, hLanes.width*BEETLE_W_RATIO, beetle.tilt);
}

function endHighway(hx, hy){
  running = false;
  flashCrash(hx, hy);
  var token = sessionToken;
  setTimeout(function(){
    if (token !== sessionToken) return;
    finishRun('highway', hScore, 'CRASH SUR LA ROUTE !');
  }, 380);
}

/* ==========================================================================
   JEU 3 — COMBI RODÉO
   Vue de côté : le Combi avance tout seul, un tap = un saut ; garder le doigt
   appuyé prolonge la montée (saut plus haut), comme dans beaucoup de jeux à
   un bouton. Vitesse illimitée comme Beetle Highway : ça accélère jusqu'à
   la fin de la partie.
   ========================================================================== */
var rGroundY = 0, rCombiSize = 0;
var combi, rObstacles, rCollectibles, rDunes, rScore, rDistance, rSpeed, rNextObstacleAt, rDuneAcc, rCollectAcc, rBestCache;
var R_BASE_SPEED = 260, R_ACCEL = 0.05, R_MIN_GAP_TIME = 0.85;
var R_GRAVITY = 2200, R_JUMP_VELOCITY = -700, R_JUMP_CUT_MULT = 2.3;
var R_COMBI_X_RATIO = 0.24;

function setupRodeoGround(){
  rGroundY = H * 0.76;
  rCombiSize = Math.min(W*0.17, 82);
}

function resetRodeo(){
  setupRodeoGround();
  combi = { x: Math.min(W*R_COMBI_X_RATIO, 105), y: rGroundY, velY:0, grounded:true, holding:false, tilt:0 };
  rObstacles = [];
  rCollectibles = [];
  rDunes = [
    { x: W*0.2, w: W*0.55, h: H*0.10 },
    { x: W*0.7, w: W*0.4, h: H*0.07 }
  ];
  particles.length = 0; scorePopups.length = 0;
  rScore = 0; rDistance = 0; rSpeed = R_BASE_SPEED; rDuneAcc = 0; rCollectAcc = 0;
  rNextObstacleAt = 420; // départ tranquille avant le premier obstacle
  rBestCache = getBest('rodeo');
  updateHUD(0, rBestCache);
}

// Déclenche le saut au moment où le doigt touche l'écran (pas au relâchement) :
// c'est en gardant le contact appuyé que la montée se prolonge (voir updateRodeo).
function tryRodeoJump(){
  if (running && combi && combi.grounded){
    combi.grounded = false;
    combi.velY = R_JUMP_VELOCITY;
    combi.holding = true;
    sfxJump();
    spawnParticles(combi.x-rCombiSize*0.12, rGroundY, [PAL.sand, PAL.creamDark], 6, { minSpeed:20, maxSpeed:70, minLife:0.2, maxLife:0.35, upBias:10 });
  }
}

function rodeoRelease(){
  if (combi) combi.holding = false;
}

// Renvoie l'étendue horizontale totale du groupe qui vient d'être posé (1 ou 2 obstacles),
// pour que updateRodeo puisse programmer le prochain groupe avec assez d'espace libre APRÈS
// celui-ci — et pas seulement après son point de spawn (c'était le bug : un combo large
// pouvait empiéter sur la marge prévue pour le groupe suivant).
function spawnRodeoObstacle(){
  var roll = Math.random();
  var type = roll < 0.4 ? 'cactus' : (roll < 0.7 ? 'rock' : 'pothole');
  var oh = type==='cactus' ? rand(44,62) : (type==='rock' ? rand(30,42) : rand(16,22));
  var ow = type==='pothole' ? rand(48,66) : rand(24,32);
  rObstacles.push({ x: W+40, w:ow, h:oh, type:type });
  var span = ow;

  // Combo seulement à partir de cactus/rock (jamais un pothole, trop large, ce qui pouvait
  // créer un écart total plus grand que ce qu'un saut peut couvrir). Écart resserré et
  // vérifié par simulation pour rester toujours sautable avec une bonne marge.
  if (type !== 'pothole' && rDistance > 500 && Math.random() < 0.24){
    var gap = rand(34,50);
    var type2 = Math.random()<0.5 ? 'cactus' : 'rock';
    var h2 = type2==='cactus' ? rand(44,62) : rand(30,42);
    var w2 = rand(24,32);
    rObstacles.push({ x: W+40+ow+gap, w:w2, h:h2, type:type2 });
    span = ow + gap + w2;
  }
  return span;
}

function spawnRodeoCollectible(){
  var hgt = rand(46, 168);
  rCollectibles.push({ x: W+30, y: rGroundY-hgt, type: Math.random()<0.55?'flower':'cap' });
}

function spawnRodeoDune(){
  rDunes.push({ x: W+80, w: rand(140,240), h: rand(H*0.05, H*0.11) });
}

function updateRodeo(dt){
  rSpeed = R_BASE_SPEED + rDistance*R_ACCEL; // pas de plafond, comme Beetle Highway : ça accélère jusqu'à la fin
  var dx = rSpeed*dt;
  rDistance += dx;
  rScore = Math.floor(rDistance/8);

  // physique du saut : tant que le doigt reste posé, la gravité normale s'applique et la
  // montée se prolonge ; dès que le doigt est relâché (ou n'a jamais été maintenu), une
  // gravité renforcée "coupe" la montée plus vite -> saut nettement plus court.
  if (!combi.grounded){
    var g = (combi.velY < 0 && !combi.holding) ? R_GRAVITY*R_JUMP_CUT_MULT : R_GRAVITY;
    combi.velY += g*dt;
    combi.y += combi.velY*dt;
    if (combi.y >= rGroundY){
      combi.y = rGroundY;
      combi.velY = 0;
      combi.grounded = true;
      sfxLand();
      spawnParticles(combi.x, rGroundY, [PAL.sand, PAL.creamDark], 7, { minSpeed:25, maxSpeed:80, minLife:0.2, maxLife:0.32 });
    }
  }
  combi.tilt = clamp(-combi.velY*0.00055, -0.30, 0.38);

  // dunes en arrière-plan (parallaxe : défilent plus lentement que le premier plan)
  for (var di=rDunes.length-1; di>=0; di--){
    rDunes[di].x -= dx*0.35;
    if (rDunes[di].x < -rDunes[di].w) rDunes.splice(di,1);
  }
  rDuneAcc += dx;
  if (rDuneAcc > 260){ rDuneAcc = 0; spawnRodeoDune(); }

  // obstacles
  for (var oi=rObstacles.length-1; oi>=0; oi--){
    rObstacles[oi].x -= dx;
    if (rObstacles[oi].x < -80) rObstacles.splice(oi,1);
  }
  // Système anti-blocage (corrigé) : le seuil minimum tient compte à la fois de la vitesse
  // (temps de réaction constant) ET de la taille de la voiture (marge physique pour atterrir),
  // et surtout de l'étendue réelle du groupe d'obstacles qu'on vient de poser — un combo large
  // ne mange plus la marge prévue pour le suivant, ce qui causait les blocages.
  if (rDistance >= rNextObstacleAt){
    var groupSpan = spawnRodeoObstacle();
    var minGapPx = rCombiSize * 2.2;
    var requiredGap = Math.max(minGapPx, rSpeed*R_MIN_GAP_TIME);
    rNextObstacleAt = rDistance + requiredGap + groupSpan;
  }

  // collectibles
  for (var ci=rCollectibles.length-1; ci>=0; ci--){
    rCollectibles[ci].x -= dx;
    if (rCollectibles[ci].x < -40) rCollectibles.splice(ci,1);
  }
  rCollectAcc += dx;
  if (rCollectAcc >= 300){
    rCollectAcc = 0;
    if (Math.random() < 0.55) spawnRodeoCollectible();
  }

  updateHUD(rScore, rBestCache);

  // collisions — boîte du Combi
  var combiW = rCombiSize*0.78, combiH = rCombiSize*0.60;
  var cx1 = combi.x - combiW/2, cx2 = combi.x + combiW/2;
  var cy1 = combi.y - combiH, cy2 = combi.y;

  // obstacles : balayage horizontal du frame (comme Highway) pour ne jamais "traverser"
  // un obstacle sans contact lorsque la vitesse devient très élevée
  for (var pi=0; pi<rObstacles.length; pi++){
    var po = rObstacles[pi];
    var poX1 = po.x - po.w/2, poX2 = (po.x+dx) + po.w/2;
    var poY1 = rGroundY - po.h, poY2 = rGroundY;
    if (rectsOverlap(cx1,cy1,cx2,cy2, poX1,poY1,poX2,poY2)){ endRodeo(combi.x, combi.y-combiH/2); return; }
  }

  // collectibles : simple superposition, ramassage immédiat
  for (var qi=rCollectibles.length-1; qi>=0; qi--){
    var qc = rCollectibles[qi];
    if (rectsOverlap(cx1,cy1,cx2,cy2, qc.x-9,qc.y-9,qc.x+9,qc.y+9)){
      rScore += 25;
      sfxPickup();
      spawnParticles(qc.x, qc.y, [PAL.mustard, PAL.terracotta, PAL.paper], 10, { upBias:30, minLife:0.3, maxLife:0.5 });
      spawnScorePopup(qc.x, qc.y, '+25', PAL.tealDark);
      rCollectibles.splice(qi,1);
      updateHUD(rScore, rBestCache);
    }
  }
}

function renderRodeo(){
  var sky = ctx.createLinearGradient(0,0,0,rGroundY);
  sky.addColorStop(0, '#CFE4E8');
  sky.addColorStop(1, '#A7C6C4');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,rGroundY);

  // soleil couchant
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,rGroundY); ctx.clip();
  // soleil voilé : halo diffus + disque ivoire chaud, qui se fond dans le ciel froid
  // au lieu de flotter comme une pastille jaune
  var sunX = W*0.76, sunY = rGroundY*0.62, sunR = Math.min(W,H)*0.098;
  var halo = ctx.createRadialGradient(sunX,sunY,sunR*0.6,sunX,sunY,sunR*2.1);
  halo.addColorStop(0,'rgba(255,252,240,0.42)');
  halo.addColorStop(1,'rgba(255,252,240,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR*2.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#F2E8CE';
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // dunes lointaines
  rDunes.forEach(function(du){ drawDune(ctx, du.x, rGroundY, du.w, du.h, 'rgba(110,132,98,0.55)'); });

  // sol
  ctx.fillStyle = PAL.sand;
  ctx.fillRect(0, rGroundY, W, H-rGroundY);
  ctx.strokeStyle = 'rgba(51,48,46,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,rGroundY); ctx.lineTo(W,rGroundY); ctx.stroke();

  // marques au sol qui défilent (sensation de vitesse)
  ctx.strokeStyle = 'rgba(51,48,46,0.18)'; ctx.lineWidth = 3;
  var dashLen=22, gap=26, period=dashLen+gap;
  var offset = rDistance % period;
  for (var mx = -period; mx < W+period; mx += period){
    var lx = mx - offset;
    ctx.beginPath(); ctx.moveTo(lx, rGroundY+10); ctx.lineTo(lx+dashLen, rGroundY+10); ctx.stroke();
  }

  // ombre de contact au sol — indique visuellement la hauteur du saut
  var jumpRatio = clamp((rGroundY - combi.y) / 130, 0, 1);
  ctx.fillStyle = 'rgba(51,48,46,' + (0.28*(1-jumpRatio*0.7)).toFixed(2) + ')';
  ctx.beginPath();
  ctx.ellipse(combi.x, rGroundY+3, rCombiSize*0.30*(1-jumpRatio*0.35), rCombiSize*0.09*(1-jumpRatio*0.35), 0, 0, Math.PI*2);
  ctx.fill();

  rCollectibles.forEach(function(cl){ drawRodeoCollectible(ctx, cl.x, cl.y, cl.type); });

  rObstacles.forEach(function(ob){
    if (ob.type==='cactus') drawCactus(ctx, ob.x, rGroundY, ob.w, ob.h);
    else if (ob.type==='rock') drawRockObstacle(ctx, ob.x, rGroundY, ob.w, ob.h);
    else drawPotholeSide(ctx, ob.x, rGroundY, ob.w, ob.h);
  });

  drawCombiSide(ctx, combi.x, combi.y, rCombiSize, combi.tilt);
}

function endRodeo(hx, hy){
  running = false;
  flashCrash(hx, hy);
  var token = sessionToken;
  setTimeout(function(){
    if (token !== sessionToken) return;
    finishRun('rodeo', rScore, 'CRASH DANS LE DÉSERT !');
  }, 380);
}

/* ==========================================================================
   FIN DE PARTIE / EFFETS PARTAGÉS
   ========================================================================== */
function flashCrash(x, y){
  sfxCrash();
  canvasWrap.classList.add('crash');
  setTimeout(function(){ canvasWrap.classList.remove('crash'); }, 450);
  if (typeof x === 'number' && typeof y === 'number'){
    spawnParticles(x, y, [PAL.brown, PAL.brownLight, PAL.terracotta], 16, { minSpeed:90, maxSpeed:220, minLife:0.4, maxLife:0.7, minSize:2.5, maxSize:5.5 });
  }
}

function finishRun(mode, score, title){
  var isRecord = setBestIfHigher(mode, score);
  if (isRecord) sfxRecord();
  goTitle.textContent = title;
  goScore.textContent = score;
  goBest.textContent = getBest(mode);
  newRecordBadge.classList.toggle('hidden', !isRecord);
  gameOverPanel.classList.remove('hidden');
}

/* ==========================================================================
   ENTRÉES (tactile + clavier)
   Combi Snake : glissé CONTINU — dès que le doigt franchit le seuil dans une
   direction, ça tourne immédiatement et le repère se réinitialise, ce qui
   permet d'enchaîner plusieurs virages sans jamais relever le doigt.
   Beetle Highway : glissé DISCRET — un seul changement de voie par geste,
   évalué au relâchement du doigt. Pour changer encore de voie, il faut lever
   le doigt et refaire un nouveau glissé gauche/droite.
   ========================================================================== */
var touchDown = false;
var touchStartX = 0, touchStartY = 0; // point de départ fixe du geste (utilisé par Highway au relâchement)
var touchRefX = 0, touchRefY = 0;     // point de référence mobile, réinitialisé en cours de geste (Snake)
var SWIPE_THRESHOLD = 18;

canvasWrap.addEventListener('pointerdown', function(e){
  touchDown = true;
  touchStartX = e.clientX; touchStartY = e.clientY;
  touchRefX = e.clientX; touchRefY = e.clientY;
  try{ canvasWrap.setPointerCapture(e.pointerId); }catch(err){}
  if (e.cancelable) e.preventDefault();
  if (currentMode === 'rodeo') tryRodeoJump();
});

canvasWrap.addEventListener('pointermove', function(e){
  if (!touchDown || !running || currentMode !== 'snake') return;
  var dx = e.clientX - touchRefX, dy = e.clientY - touchRefY;
  if (Math.abs(dx) >= SWIPE_THRESHOLD || Math.abs(dy) >= SWIPE_THRESHOLD){
    if (Math.abs(dx) > Math.abs(dy)) queueSnakeDir(dx>0?1:-1, 0);
    else queueSnakeDir(0, dy>0?1:-1);
    touchRefX = e.clientX; touchRefY = e.clientY;
  }
});

canvasWrap.addEventListener('pointerup', function(e){
  if (touchDown && currentMode === 'highway' && running){
    var dx = e.clientX - touchStartX;
    if (Math.abs(dx) >= SWIPE_THRESHOLD){
      setBeetleLane(beetle.targetLane + (dx>0?1:-1));
    }
  }
  if (currentMode === 'rodeo') rodeoRelease();
  touchDown = false;
});
canvasWrap.addEventListener('pointercancel', function(){
  if (currentMode === 'rodeo') rodeoRelease();
  touchDown = false;
});

var rodeoKeyHeld = false;
window.addEventListener('keydown', function(e){
  if (!running) return;
  if (currentMode === 'snake'){
    if (e.key === 'ArrowUp') queueSnakeDir(0,-1);
    else if (e.key === 'ArrowDown') queueSnakeDir(0,1);
    else if (e.key === 'ArrowLeft') queueSnakeDir(-1,0);
    else if (e.key === 'ArrowRight') queueSnakeDir(1,0);
  } else if (currentMode === 'highway'){
    if (e.key === 'ArrowLeft') setBeetleLane(beetle.targetLane-1);
    else if (e.key === 'ArrowRight') setBeetleLane(beetle.targetLane+1);
  } else if (currentMode === 'rodeo'){
    if ((e.key === ' ' || e.key === 'ArrowUp') && !rodeoKeyHeld){
      rodeoKeyHeld = true;
      tryRodeoJump();
    }
  }
});
window.addEventListener('keyup', function(e){
  if (e.key === ' ' || e.key === 'ArrowUp'){
    rodeoKeyHeld = false;
    if (currentMode === 'rodeo') rodeoRelease();
  }
});

function showHint(text){ swipeHint.textContent = text; swipeHint.classList.add('show'); }
function hideHint(){ swipeHint.classList.remove('show'); }

/* ==========================================================================
   COMPTE À REBOURS / NAVIGATION
   ========================================================================== */
function startCountdown(onDone){
  var token = sessionToken;
  var seq = ['3','2','1','GO !'];
  var i = 0;
  countdownEl.classList.add('show');
  function step(){
    if (token !== sessionToken) return;
    countdownEl.textContent = seq[i];
    if (i < seq.length-1) sfxCountdownTick(); else sfxCountdownGo();
    i++;
    if (i < seq.length){
      setTimeout(step, 550);
    } else {
      setTimeout(function(){
        if (token !== sessionToken) return;
        countdownEl.classList.remove('show');
        onDone();
      }, 550);
    }
  }
  step();
}

function updateHUD(score, best){
  hudScoreEl.textContent = score;
  // affiche le record provisoire en direct dès qu'on le dépasse en cours de partie,
  // plutôt qu'un chiffre figé au score d'avant-partie
  hudBestEl.textContent = Math.max(score, best||0);
}

function showScreen(id){
  var screens = document.querySelectorAll('.screen');
  for (var i=0;i<screens.length;i++){ screens[i].classList.remove('is-active'); }
  document.getElementById(id).classList.add('is-active');
}

function goToMenu(){
  sessionToken++;
  running = false; currentMode = null;
  gameOverPanel.classList.add('hidden');
  bestSnakeEl.textContent = getBest('snake');
  bestHighwayEl.textContent = getBest('highway');
  bestRodeoEl.textContent = getBest('rodeo');
  showScreen('screen-menu');
}

function playMode(mode){
  sessionToken++;
  currentMode = mode;
  gameOverPanel.classList.add('hidden');
  showScreen('screen-game');
  resizeCanvas();
  if (mode === 'snake'){
    resetSnake();
    renderSnake();
    showHint('Glisse le doigt pour diriger le Combi');
  } else if (mode === 'highway'){
    resetHighway();
    renderHighway();
    showHint('Glisse le doigt à gauche ou à droite pour changer de voie');
  } else if (mode === 'rodeo'){
    resetRodeo();
    renderRodeo();
    showHint('Touche l\'écran pour sauter, garde appuyé pour sauter plus haut');
  }
  running = false;
  startCountdown(function(){ running = true; });
}

function retry(){ playMode(currentMode); }

/* --------------------------------- BOUTONS --------------------------------- */
var modeCards = document.querySelectorAll('.mode-card');
for (var m=0;m<modeCards.length;m++){
  modeCards[m].addEventListener('click', function(){ sfxClick(); playMode(this.getAttribute('data-mode')); });
}
btnBack.addEventListener('click', function(){
  sfxClick();
  if (currentMode === 'snake') setBestIfHigher('snake', sScore);
  if (currentMode === 'highway') setBestIfHigher('highway', hScore);
  if (currentMode === 'rodeo') setBestIfHigher('rodeo', rScore);
  goToMenu();
});
btnRetry.addEventListener('click', function(){ sfxClick(); gameOverPanel.classList.add('hidden'); retry(); });
btnMenu.addEventListener('click', function(){ sfxClick(); goToMenu(); });
btnMute.addEventListener('click', toggleSound);

/* ------------------------------- BOUCLE PRINCIPALE ------------------------------- */
var lastTs = 0;
function loop(ts){
  var dt = Math.min(0.05, lastTs ? (ts-lastTs)/1000 : 0);
  lastTs = ts;
  // Les particules continuent d'animer même juste après la fin de partie (running=false),
  // le temps que l'effet d'impact se termine, sans quoi elles resteraient figées à l'écran.
  if (running || particles.length || scorePopups.length){
    if (currentMode === 'snake'){ if (running) updateSnake(dt*1000); renderSnake(); }
    else if (currentMode === 'highway'){ if (running) updateHighway(dt); renderHighway(); }
    else if (currentMode === 'rodeo'){ if (running) updateRodeo(dt); renderRodeo(); }
    updateParticles(dt);
    renderParticles(ctx);
    updateScorePopups(dt);
    renderScorePopups(ctx);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------------------------- INIT ---------------------------------- */
bestSnakeEl.textContent = getBest('snake');
bestHighwayEl.textContent = getBest('highway');
bestRodeoEl.textContent = getBest('rodeo');
btnMute.textContent = soundEnabled ? '🔊' : '🔇';
drawMenuIcons();

})();
</script>
